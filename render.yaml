services:
  - type: web
    name: prepkit-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: npm ci --omit=dev --workspace=@prepkit/api
    startCommand: npm run start -w @prepkit/api
    healthCheckPath: /api/health
    # Deploys are triggered by the CI workflow's deploy hook after the checks pass, not by pushes.
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: WEB_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
