# Every push and pull request: install from the lockfile, typecheck all three workspaces, run
# every test, lint and build the web app. Nothing here needs a model key or a database — the
# tests use a scripted model and in-memory repositories — so the batch command itself is not run:
# it would need a real key and would spend the shared free-tier quota on every push.
#
# Deploys wait for this and happen from here: once the checks pass on main, the API is deployed
# on Render and the web app on Vercel, in parallel, by the two deploy jobs below. Neither host
# deploys on its own (Render's auto-deploy is off, Vercel is not connected to the repository), so
# there is one pipeline, every deploy is visible on the commit, and what was tested is what goes
# live.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint the web app
        run: npm run lint -w @prepkit/web

      - name: Build the web app
        run: npm run build -w @prepkit/web

  deploy-api:
    # Render pulls the commit and runs render.yaml's build and start; this only tells it to.
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger the Render deploy
        run: |
          curl --fail --silent --show-error "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  deploy-web:
    # Vercel builds and deploys what CI checked. `--prebuilt` deploys the build made here.
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: npm i -g vercel@latest
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy, and point the public address at it
        run: |
          set -o pipefail
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" | tail -1)
          echo "deployed $url"
          vercel alias set "$url" prepkit-zeta.vercel.app --token="$VERCEL_TOKEN"
